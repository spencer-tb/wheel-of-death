name: Repo stats

# Build the execution-specs stats and publish them to KV for the stats
# section. Uses the workflow's own GitHub token, so no extra secret.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build stats from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/update-stats.ts stats.json

      # Namespace id matches the WHEELS binding in wrangler.toml. Two-day TTL
      # so a broken schedule shows "unavailable" rather than ancient numbers.
      - name: Publish to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler kv key put github_stats_v4 --path stats.json --namespace-id a9448683d6dd40f0b80cb36963b009e1 --remote --ttl 172800
